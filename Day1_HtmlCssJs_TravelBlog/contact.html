<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Travel Blog - Contact</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav>
    <div class="logo">Travel Blog</div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="destinations.html">Destinations</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <header class="page-header">
    <h1>Contact Us</h1>
    <p>Have a question or travel tip to share? Drop us a message.</p>
  </header>

  <main>
    <section class="section container">
      <div class="contact-wrapper">
        <div>
          <h2 style="font-size: 1.3rem; margin-bottom: 15px;">Send a Message</h2>

          <form id="contact-form">
            <div class="form-group">
              <label for="name">Full Name *</label>
              <input type="text" id="name" name="name" placeholder="Jane Smith" required />
            </div>

            <div class="form-group">
              <label for="email">Email Address *</label>
              <input type="email" id="email" name="email" placeholder="jane@example.com" required />
            </div>

            <div class="form-group">
              <label for="topic">Topic</label>
              <select id="topic" name="topic">
                <option value="">-- Select a topic --</option>
                <option value="general">General Inquiry</option>
                <option value="collaboration">Collaboration</option>
                <option value="feedback">Feedback</option>
                <option value="other">Other</option>
              </select>
            </div>

            <div class="form-group">
              <label for="message">Message *</label>
              <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
            </div>

            <button type="submit" class="btn btn-blue">Send Message</button>
          </form>

          <div class="form-success" id="form-success">
            Your message has been sent! We will get back to you soon.
          </div>
        </div>

      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Travel Blog. | <a href="contact.html">Contact Us</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
